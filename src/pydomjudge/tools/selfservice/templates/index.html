{% extends "base.html" %}

{% block title %}Your account{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-4 text-center">Your DOMjudge account</h1>
        <div class="d-grid gap-3">
            {% for endpoint, label in pages %}
            <a class="btn btn-primary btn-lg" href="{{ url_for(endpoint) }}">{{ label }}</a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
