[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydomjudge"
version = "0.4.0"
description = "Automate DOMjudge from Python: problems, contests, users, and companion tools"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
authors = [{ name = "Tobias Meggendorfer", email = "tobias@meggendorfer.de" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

dependencies = [
  "pymysql>=1.1",
  "PyYAML>=6.0",
  "Pillow>=9.0",
  "python-dateutil>=2.9",
  "tzlocal>=5",
  "problemtools",
  "bcrypt>=4",
  "chardet>=5",
  "pydantic>=2.12",
  "jinja2>=3.1",
  "argcomplete>=3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "flask>=3.1.3",
  "Flask-WTF>=1.2",
]

[project.urls]
Repository = "https://github.com/DOMtutor/pyjudge"
Issues = "https://github.com/DOMtutor/pyjudge/issues"

[project.scripts]
pyjudge = "pydomjudge.scripts.commands:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pydomjudge-course[plagiarism]",
  "pytest>=8",
  "ruff>=0.17",
  "ty>=0.0.90",
]

[tool.uv.sources]
problemtools = { path = "./libs/problemtools" }
pydomjudge-course = { workspace = true }

[tool.uv.workspace]
# The watcher is an independent project (no dependency on pydomjudge) and
# course/ (pydomjudge-course) a separately versioned package on top of it;
# both share the lock file and the development environment
members = ["tools/watcher", "course"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pydomjudge" = ["default_wordlist.gz"]
"pydomjudge.repository" = ["languages.yml"]
"pydomjudge.repository.runscript" = ["**"]
"pydomjudge.repository.compiler" = ["*/**"]
"pydomjudge.repository.checker" = ["*/**"]
"pydomjudge.scripts.scaffold" = ["problem/**", "seeded/**", "solutions/**"]
"pydomjudge.tools.fuzzer" = ["static/**/*", "templates/**/*"]
"pydomjudge.tools.selfservice" = ["static/**/*", "templates/**/*", "example_config.yaml"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["libs", "examples/repository", "build"]

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle, I: import order, UP: modern syntax, B: bugbear
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pydomjudge", "pydomjudge_course"]
combine-as-imports = true

[tool.ty.src]
include = ["src", "tests", "tools/watcher", "course/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running DOMjudge, see tests/integration/run.sh (skipped otherwise)",
]
