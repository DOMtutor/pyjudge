[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pydomjudge-course"
version = "0.1.0"
description = "Moodle and grading plumbing for courses that use pydomjudge"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Tobias Meggendorfer", email = "tobias@meggendorfer.de" }]
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.4",
  "openpyxl>=3.1",
  "pydomjudge",
]

[project.optional-dependencies]
plagiarism = ["copydetect>=0.5", "pygments>=2.19", "rapidfuzz>=3.14"]

[tool.uv.sources]
pydomjudge = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
