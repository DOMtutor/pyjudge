volumes:
  domjudge_mariadb_data: {}
  domjudge_mariadb_backup: {}

networks:
  domjudge:
    driver: bridge

configs:
  # Configuration of the self-service (profile "selfservice"), see docs/tools.md
  selfservice-config:
    content: |
      secret_key_env: SELFSERVICE_SECRET_KEY
      server:
        # Set to the number of reverse proxies in front of it
        trust_proxy: 1
      database:
        host: domjudge_mariadb
        user: domjudge
        database: domjudge
        password_env: DOMJUDGE_DB_DOMJUDGE_PASSWORD
      services:
        register:
          category: participants
        change_password: {}

x-judgehost-config: &judgehost-config
  # Official alternative: domjudge/judgehost:9.0.1 (without the DOMtutor additions)
  image: incaseoftrouble/domtutor_judgehost:latest
  cgroup: host
  restart: on-failure
  networks:
    - domjudge
  depends_on:
    - domserver
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup
  privileged: true
  environment: &judgehost-environment
    CONTAINER_TIMEZONE: ${TZ}
    JUDGEDAEMON_USERNAME: judgehost
    JUDGEDAEMON_PASSWORD: ${DOMJUDGE_JUDGE_PASSWORD:?}
    DOMSERVER_BASEURL: http://domjudge/

services:
  domjudge_mariadb:
    container_name: domjudge_mariadb
    image: mariadb:12
    command: --innodb_snapshot_isolation=OFF --max-connections=1000 --innodb-log-file-size=2G --max-allowed-packet=1G --net_read_timeout=3600 --net_write_timeout=3600
    networks:
      - domjudge
    ports:
      - 3306:3306/tcp
    volumes:
      - domjudge_mariadb_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DOMJUDGE_DB_ROOT_PASSWORD:?}
      MARIADB_USER: domjudge
      MARIADB_PASSWORD: ${DOMJUDGE_DB_DOMJUDGE_PASSWORD:?}
      MARIADB_DATABASE: domjudge

  domjudge-mariadb-backup:
    container_name: domjudge_mariadb_backup
    image: fradelg/mysql-cron-backup:1.14.1
    networks:
      - domjudge
    volumes:
      - domjudge_mariadb_backup:/backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: domjudge_mariadb
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: ${DOMJUDGE_DB_ROOT_PASSWORD:?}
      CRON_TIME: "12 */6 * * *"
      MAX_BACKUPS: 12
      INIT_BACKUP: 1
      TZ: ${TZ}

  domserver:
    container_name: domjudge
    # Official alternative: domjudge/domserver:9.0.1
    image: incaseoftrouble/domtutor_domserver:latest
    networks:
      - domjudge
    ports:
      - ${DOMJUDGE_PORT:-12345}:80/tcp
    restart: unless-stopped
    depends_on:
      - domjudge_mariadb
    environment:
      MYSQL_HOST: domjudge_mariadb
      MYSQL_ROOT_PASSWORD: ${DOMJUDGE_DB_ROOT_PASSWORD:?}
      MYSQL_USER: domjudge
      MYSQL_PASSWORD: ${DOMJUDGE_DB_DOMJUDGE_PASSWORD:?}
      MYSQL_DATABASE: domjudge
      CONTAINER_TIMEZONE: ${TZ}
      DJ_DB_INSTALL_BARE: 1
      # The port in the browser, so that DOMjudge's redirects keep it: a start
      # script of the DOMtutor image from its next build on (see
      # docs/deployment.md), ignored by the official image. Set
      # DOMJUDGE_PUBLIC_PORT= (empty) behind a reverse proxy on port 80/443
      DOMJUDGE_PUBLIC_PORT: ${DOMJUDGE_PUBLIC_PORT-${DOMJUDGE_PORT:-12345}}

  judgehost:
    <<: *judgehost-config
    container_name: judgehost
    hostname: judgehost
    environment:
      # A plain "environment:" here would replace the shared one entirely
      <<: *judgehost-environment
      DAEMON_ID: 1

  # Started with "docker compose --profile selfservice up -d". Only listens on
  # localhost: put a reverse proxy with TLS in front of it.
  selfservice:
    # Built locally with "docker build -t pyjudge ." in the pyjudge checkout;
    # set PYJUDGE_IMAGE to use another image
    image: ${PYJUDGE_IMAGE:-pyjudge:latest}
    profiles:
      - selfservice
    networks:
      - domjudge
    restart: unless-stopped
    container_name: pyjudge_selfservice
    command: selfservice
    depends_on:
      - domjudge_mariadb
    ports:
      - 127.0.0.1:${SELFSERVICE_PORT:-8001}:8000/tcp
    environment:
      APP_CONFIG_PATH: /config/selfservice.yaml
      # Required for the self-service; generate one with
      # python -c 'import secrets; print(secrets.token_urlsafe(32))'
      SELFSERVICE_SECRET_KEY: ${SELFSERVICE_SECRET_KEY:-}
      DOMJUDGE_DB_DOMJUDGE_PASSWORD: ${DOMJUDGE_DB_DOMJUDGE_PASSWORD:?}
    configs:
      - source: selfservice-config
        target: /config/selfservice.yaml
