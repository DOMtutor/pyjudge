# Throwaway DOMjudge for the integration tests, see run.sh. Mirrors
# docs/docker-compose.yml (database settings) without backups and persistence.
name: pyjudge-it

configs:
  # Same as in docs/docker-compose.yml: the image's nginx passes the Host header
  # without port to DOMjudge, whose absolute redirects then point to port 80
  domserver-public-port:
    content: |
      #!/bin/sh
      host='$$host'
      case "$${DOMJUDGE_PUBLIC_PORT:-}" in
        ""|80|443) ;;
        *) host="$$host:$${DOMJUDGE_PUBLIC_PORT}" ;;
      esac
      sed -i "s|^fastcgi_param  HTTP_HOST .*|fastcgi_param  HTTP_HOST        $$host;|" /etc/nginx/fastcgi_params
      echo "[ok] DOMjudge passes HTTP_HOST $$host"

  # Same as in docs/docker-compose.yml: initial admin and judgehost passwords
  domserver-passwords:
    content: |
      #!/bin/sh -e
      cd /opt/domjudge/domserver/etc
      umask 077
      if [ -n "$${DOMJUDGE_ADMIN_PASSWORD:-}" ]; then
        echo "$${DOMJUDGE_ADMIN_PASSWORD}" > initial_admin_password.secret
      fi
      printf 'default\thttp://localhost/domjudge/api\tjudgehost\t%s\n' "$${DOMJUDGE_JUDGE_PASSWORD:?}" > restapi.secret
      echo "[ok] Initial passwords from the environment"

services:
  mariadb:
    image: mariadb:12
    # Same server options as docs/docker-compose.yml; DOMjudge needs
    # innodb_snapshot_isolation=OFF
    # (the 2G log file lives in the tmpfs, i.e. in memory)
    command: --innodb_snapshot_isolation=OFF --max-connections=1000 --innodb-log-file-size=2G --max-allowed-packet=1G --net_read_timeout=3600 --net_write_timeout=3600
    tmpfs:
      - /var/lib/mysql
    ports:
      - 127.0.0.1:${PYJUDGE_IT_DB_PORT:-13306}:3306
    environment:
      MARIADB_ROOT_PASSWORD: root-it
      MARIADB_USER: domjudge
      MARIADB_PASSWORD: domjudge-it
      MARIADB_DATABASE: domjudge
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  domserver:
    image: ${DOMJUDGE_DOMSERVER_IMAGE:-domjudge/domserver:9.0.1}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PYJUDGE_IT_WEB_PORT:-18080}:80
    environment:
      MYSQL_HOST: mariadb
      MYSQL_ROOT_PASSWORD: root-it
      MYSQL_USER: domjudge
      MYSQL_PASSWORD: domjudge-it
      MYSQL_DATABASE: domjudge
      CONTAINER_TIMEZONE: Europe/Berlin
      DJ_DB_INSTALL_BARE: 1
      DOMJUDGE_ADMIN_PASSWORD: admin-it
      DOMJUDGE_JUDGE_PASSWORD: judgehost-it
      DOMJUDGE_PUBLIC_PORT: ${PYJUDGE_IT_WEB_PORT:-18080}
    configs:
      - source: domserver-passwords
        target: /scripts/start.ro/20-passwords.sh
        mode: 0555
      - source: domserver-public-port
        target: /scripts/start.ro/40-public-port.sh
        mode: 0555
    healthcheck:
      test: ["CMD", "/scripts/bin/healthcheck"]
      interval: 3s
      start_period: 120s
      retries: 60

  judgehost:
    profiles: [judge]
    image: ${DOMJUDGE_JUDGEHOST_IMAGE:-domjudge/judgehost:9.0.1}
    depends_on:
      domserver:
        condition: service_healthy
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
    hostname: judgehost-it
    environment:
      CONTAINER_TIMEZONE: Europe/Berlin
      DOMSERVER_BASEURL: http://domserver/
      JUDGEDAEMON_USERNAME: judgehost
      # The domserver's DOMJUDGE_JUDGE_PASSWORD
      JUDGEDAEMON_PASSWORD: judgehost-it
      DAEMON_ID: 0
